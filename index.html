<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道诡人生 · Daogui Life</title>
<!-- STYLES_PLACEHOLDER -->
<style>
/* === BASE RESET & FONTS === */
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap');
:root {
  --crimson: #8B0000;
  --deep-crimson: #6B0000;
  --blood: #a02020;
  --gold: #C5A55A;
  --gold-dim: #8a7a3a;
  --ink: #0a0808;
  --paper: #1a1410;
  --paper-light: #2a2018;
  --text: #d4c8b0;
  --text-dim: #8a7e6e;
  --text-bright: #e8dcc8;
  --accent-green: #4a7a3a;
  --accent-purple: #6a3a6a;
  --danger: #cc3333;
  --mystery: #7a4aaa;
  --border: #3a2a1a;
  --panel-bg: rgba(20,14,10,0.92);
  --panel-border: rgba(139,0,0,0.3);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
  background: var(--ink);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* === BACKGROUND LAYERS === */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(139,0,0,0.15) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(107,0,0,0.1) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(26,20,16,1) 0%, rgba(10,8,8,1) 100%);
  z-index: -2;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='60' height='60' fill='none'/%3E%3Cpath d='M0 0h10v10H0zm50 0h10v10H50zM0 50h10v10H0zm50 50h10v10H50z' fill='rgba(139,0,0,0.03)'/%3E%3C/svg%3E");
  z-index: -1;
  pointer-events: none;
}

/* === FLOATING PARTICLES (talismans) === */
#particles-canvas {
  position: fixed; inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: 0.6;
}

/* === CONTAINER === */
.container {
  max-width: 860px;
  margin: 0 auto;
  padding: 30px 20px 60px;
  position: relative;
}

/* === TITLE === */
.game-title {
  text-align: center;
  margin-bottom: 40px;
  position: relative;
}
.game-title h1 {
  font-family: 'Ma Shan Zheng', 'ZCOOL XiaoWei', serif;
  font-size: 3.6em;
  color: var(--crimson);
  text-shadow: 0 0 40px rgba(139,0,0,0.6), 0 0 80px rgba(139,0,0,0.3), 0 2px 4px rgba(0,0,0,0.8);
  letter-spacing: 12px;
  line-height: 1.2;
  animation: titlePulse 4s ease-in-out infinite;
}
.game-title .subtitle {
  font-family: 'ZCOOL XiaoWei', serif;
  color: var(--text-dim);
  font-size: 0.95em;
  letter-spacing: 6px;
  margin-top: 8px;
}
@keyframes titlePulse {
  0%, 100% { text-shadow: 0 0 40px rgba(139,0,0,0.6), 0 0 80px rgba(139,0,0,0.3), 0 2px 4px rgba(0,0,0,0.8); }
  50% { text-shadow: 0 0 60px rgba(139,0,0,0.8), 0 0 120px rgba(139,0,0,0.4), 0 2px 4px rgba(0,0,0,0.8); }
}

/* === DECORATIVE DIVIDER === */
.divider {
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--crimson), var(--gold-dim), var(--crimson), transparent);
  margin: 20px 0;
  opacity: 0.5;
}
.divider-ornate {
  text-align: center;
  color: var(--gold-dim);
  font-size: 0.8em;
  letter-spacing: 8px;
  margin: 16px 0;
  opacity: 0.5;
}

/* === PANELS === */
.panel {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 4px;
  padding: 28px;
  margin-bottom: 20px;
  position: relative;
  backdrop-filter: blur(10px);
  box-shadow: 0 4px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(139,0,0,0.1);
}
.panel::before {
  content: '';
  position: absolute;
  top: 4px; left: 4px; right: 4px; bottom: 4px;
  border: 1px solid rgba(139,0,0,0.1);
  border-radius: 2px;
  pointer-events: none;
}
.panel-title {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 1.5em;
  color: var(--gold);
  margin-bottom: 16px;
  letter-spacing: 4px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.panel-title .icon {
  width: 24px; height: 24px;
  background: var(--crimson);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.6em;
  flex-shrink: 0;
}

/* === STATS GRID === */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.stat-box {
  background: rgba(139,0,0,0.08);
  border: 1px solid rgba(139,0,0,0.2);
  border-radius: 4px;
  padding: 14px 10px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
}
.stat-box::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: var(--crimson);
  transform: scaleX(0);
  transition: transform 0.3s;
}
.stat-box:hover::after { transform: scaleX(1); }
.stat-label {
  font-size: 0.78em;
  color: var(--text-dim);
  letter-spacing: 2px;
  margin-bottom: 6px;
}
.stat-value {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 1.5em;
  color: var(--gold);
  line-height: 1;
}
.stat-value.danger { color: var(--danger); }
.stat-value.low { color: #cc6633; }

/* === DETAIL STATS === */
.detail-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.detail-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 14px;
  background: rgba(0,0,0,0.3);
  border-radius: 3px;
  border-left: 2px solid var(--deep-crimson);
}
.detail-label { color: var(--text-dim); font-size: 0.85em; }
.detail-value { color: var(--text-bright); font-weight: 700; font-size: 0.9em; }

/* === SANITY BAR === */
.sanity-bar-wrap {
  margin: 14px 0 6px;
  position: relative;
}
.sanity-bar-bg {
  height: 6px;
  background: rgba(0,0,0,0.5);
  border-radius: 3px;
  overflow: hidden;
}
.sanity-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--danger), var(--crimson), var(--gold));
  border-radius: 3px;
  transition: width 0.5s ease;
  box-shadow: 0 0 8px rgba(139,0,0,0.5);
}
.sanity-label {
  font-size: 0.75em;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
}

/* === BUTTONS === */
.btn {
  font-family: 'Noto Serif SC', serif;
  background: linear-gradient(180deg, var(--crimson), var(--deep-crimson));
  color: var(--text-bright);
  border: 1px solid rgba(197,165,90,0.3);
  padding: 14px 28px;
  font-size: 1em;
  border-radius: 3px;
  cursor: pointer;
  width: 100%;
  margin: 5px 0;
  letter-spacing: 3px;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
.btn:hover {
  background: linear-gradient(180deg, #a02020, var(--crimson));
  box-shadow: 0 0 20px rgba(139,0,0,0.4);
  border-color: var(--gold-dim);
}
.btn:active { transform: scale(0.98); }
.btn:disabled {
  background: rgba(40,30,20,0.8);
  color: var(--text-dim);
  border-color: var(--border);
  cursor: not-allowed;
  box-shadow: none;
}
.btn-secondary {
  background: linear-gradient(180deg, rgba(139,0,0,0.3), rgba(107,0,0,0.3));
  border-color: rgba(139,0,0,0.3);
}
.btn-secondary:hover {
  background: linear-gradient(180deg, rgba(139,0,0,0.5), rgba(107,0,0,0.5));
}
.btn-auto {
  background: linear-gradient(180deg, #2a4a2a, #1a3a1a);
  border-color: rgba(74,122,58,0.4);
}
.btn-auto:hover { background: linear-gradient(180deg, #3a5a3a, #2a4a2a); }
.btn-auto.active {
  background: linear-gradient(180deg, var(--crimson), var(--deep-crimson));
  border-color: var(--gold-dim);
  animation: autoPulse 2s ease-in-out infinite;
}
@keyframes autoPulse {
  0%, 100% { box-shadow: 0 0 10px rgba(139,0,0,0.3); }
  50% { box-shadow: 0 0 25px rgba(139,0,0,0.6); }
}
.btn-speed {
  background: rgba(40,30,20,0.6);
  border: 1px solid var(--border);
  padding: 8px 12px;
  font-size: 0.85em;
  width: auto;
  flex: 1;
  letter-spacing: 1px;
  min-width: 50px;
}
.btn-speed.active {
  background: var(--crimson);
  border-color: var(--gold-dim);
  color: var(--gold);
}

/* === CONTROL BAR === */
.control-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.control-bar .btn { flex: 1; min-width: 100px; }

/* === TALENT GRID === */
.talent-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin: 16px 0;
}
.talent-card {
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
}
.talent-card:hover {
  border-color: var(--crimson);
  background: rgba(139,0,0,0.08);
}
.talent-card.selected {
  border-color: var(--gold);
  background: rgba(197,165,90,0.08);
  box-shadow: 0 0 15px rgba(197,165,90,0.1);
}
.talent-card.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
.talent-name {
  font-family: 'Ma Shan Zheng', serif;
  color: var(--gold);
  font-size: 1.15em;
  letter-spacing: 2px;
}
.talent-desc {
  color: var(--text-dim);
  font-size: 0.82em;
  margin-top: 4px;
  line-height: 1.4;
}
.talent-tag {
  display: inline-block;
  font-size: 0.7em;
  padding: 2px 8px;
  border-radius: 2px;
  margin-top: 6px;
  letter-spacing: 1px;
}
.talent-hint {
  font-size: 0.72em;
  color: var(--text-dim);
  margin-top: 6px;
  line-height: 1.4;
  opacity: 0.7;
  font-style: italic;
}
.tag-good { background: rgba(74,122,58,0.4); color: #8aba7a; border: 1px solid rgba(74,122,58,0.5); }
.tag-bad { background: rgba(139,0,0,0.4); color: #cc6666; border: 1px solid rgba(139,0,0,0.5); }
.tag-special { background: rgba(106,58,106,0.4); color: #ba8aba; border: 1px solid rgba(106,58,106,0.5); }

/* === RARITY TIERS === */
.rarity-common .talent-name { color: #8a8a8a; }
.rarity-common { border-color: rgba(100,100,100,0.3); }
.rarity-common .talent-tag { background: rgba(100,100,100,0.3); color: #aaa; border: 1px solid rgba(100,100,100,0.4); }

.rarity-uncommon .talent-name { color: #5aaa5a; }
.rarity-uncommon { border-color: rgba(90,170,90,0.3); }
.rarity-uncommon .talent-tag { background: rgba(90,170,90,0.15); color: #6cc06c; border: 1px solid rgba(90,170,90,0.4); }

.rarity-rare .talent-name { color: #5a8acc; }
.rarity-rare { border-color: rgba(90,138,204,0.3); }
.rarity-rare .talent-tag { background: rgba(90,138,204,0.15); color: #6a9adc; border: 1px solid rgba(90,138,204,0.4); }

.rarity-epic .talent-name { color: #b06acc; }
.rarity-epic { border-color: rgba(176,106,204,0.35); }
.rarity-epic .talent-tag { background: rgba(176,106,204,0.15); color: #c07ae0; border: 1px solid rgba(176,106,204,0.4); }
.rarity-epic.selected { border-color: #b06acc; box-shadow: 0 0 15px rgba(176,106,204,0.2); }

.rarity-legendary .talent-name { color: var(--gold); text-shadow: 0 0 8px rgba(197,165,90,0.3); }
.rarity-legendary { border-color: rgba(197,165,90,0.4); background: rgba(197,165,90,0.04); }
.rarity-legendary .talent-tag { background: rgba(197,165,90,0.2); color: var(--gold); border: 1px solid rgba(197,165,90,0.5); }
.rarity-legendary.selected { border-color: var(--gold); box-shadow: 0 0 20px rgba(197,165,90,0.25); }
@keyframes legendaryShimmer {
  0%, 100% { border-color: rgba(197,165,90,0.4); }
  50% { border-color: rgba(197,165,90,0.7); }
}
.rarity-legendary { animation: legendaryShimmer 3s ease-in-out infinite; }

.rarity-cursed .talent-name { color: #cc4444; }
.rarity-cursed { border-color: rgba(204,68,68,0.3); }
.rarity-cursed .talent-tag { background: rgba(204,68,68,0.15); color: #dd5555; border: 1px solid rgba(204,68,68,0.4); }

/* === REFRESH BUTTON === */
.btn-refresh {
  background: linear-gradient(180deg, rgba(90,138,204,0.3), rgba(60,100,160,0.3));
  border-color: rgba(90,138,204,0.4);
  margin-bottom: 12px;
}
.btn-refresh:hover {
  background: linear-gradient(180deg, rgba(90,138,204,0.5), rgba(60,100,160,0.5));
  border-color: rgba(90,138,204,0.6);
}

/* === SANITY SECTION HIDDEN === */
.sanity-section.sanity-hidden { display: none; }

/* === EVENT & LOG === */
.event-area {
  min-height: 80px;
  margin-bottom: 16px;
  font-size: 1.05em;
  line-height: 1.8;
  color: var(--text);
}
.event-area strong { color: var(--gold); }
.choice-btn {
  background: rgba(30,20,14,0.8);
  border: 1px solid rgba(139,0,0,0.25);
  color: var(--text);
  margin: 6px 0;
  text-align: left;
  padding: 12px 18px;
  font-family: 'Noto Serif SC', serif;
  font-size: 0.95em;
  border-radius: 3px;
  cursor: pointer;
  width: 100%;
  transition: all 0.2s;
  letter-spacing: 1px;
}
.choice-btn:hover {
  background: rgba(139,0,0,0.15);
  border-color: var(--crimson);
  padding-left: 24px;
}
.log-area {
  height: 320px;
  overflow-y: auto;
  background: rgba(0,0,0,0.4);
  padding: 18px;
  border-radius: 3px;
  border: 1px solid rgba(139,0,0,0.1);
  font-size: 0.9em;
  line-height: 1.7;
}
.log-area::-webkit-scrollbar { width: 4px; }
.log-area::-webkit-scrollbar-track { background: transparent; }
.log-area::-webkit-scrollbar-thumb { background: var(--deep-crimson); border-radius: 2px; }
.log-entry {
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(139,0,0,0.1);
  animation: logFadeIn 0.4s ease;
}
@keyframes logFadeIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
.log-year { color: var(--text-dim); font-size: 0.8em; }
.log-content { color: var(--text); margin-top: 3px; display: block; }

/* === INLINE TEXT STYLES === */
.npc { color: #ba8aba; font-weight: 700; }
.loc { color: var(--gold); }
.fac { color: var(--crimson); font-weight: 700; }
.mys { color: var(--mystery); font-style: italic; }
.itm { color: #7aaa5a; font-weight: 700; }
.danger-text { color: var(--danger); }

/* === BORN PANEL === */
.born-info {
  text-align: center;
  padding: 30px 20px;
  background: rgba(0,0,0,0.3);
  border-radius: 4px;
  margin-bottom: 20px;
  border: 1px solid rgba(139,0,0,0.15);
}
.born-location {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 1.8em;
  color: var(--gold);
  letter-spacing: 6px;
  margin-bottom: 10px;
}
.born-desc { color: var(--text-dim); line-height: 1.6; }

/* === ENDING PANEL === */
.ending-content {
  text-align: center;
  padding: 20px;
}
.ending-content p {
  margin: 10px 0;
  font-size: 1.05em;
}
.ending-reason {
  color: var(--crimson);
  font-size: 1.15em;
  margin-top: 20px;
  padding: 16px;
  background: rgba(139,0,0,0.08);
  border-radius: 4px;
  border: 1px solid rgba(139,0,0,0.2);
}

/* === ITEMS DISPLAY === */
.items-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.item-badge {
  font-size: 0.75em;
  padding: 3px 10px;
  background: rgba(139,0,0,0.15);
  border: 1px solid rgba(139,0,0,0.25);
  border-radius: 2px;
  color: var(--gold);
  letter-spacing: 1px;
}

/* === ACHIEVEMENTS === */
.achieve-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.achieve-badge {
  text-align: center;
  padding: 10px 6px;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 0.78em;
  color: var(--text-dim);
  transition: all 0.3s;
}
.achieve-badge.unlocked {
  border-color: var(--gold-dim);
  color: var(--gold);
  background: rgba(197,165,90,0.06);
}
.achieve-icon { font-size: 1.5em; margin-bottom: 4px; }

/* === TRAVEL MODAL === */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.modal-overlay.active { opacity: 1; pointer-events: all; }
.modal-content {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 4px;
  padding: 30px;
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
}
.location-option {
  padding: 12px 16px;
  margin: 6px 0;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.2s;
}
.location-option:hover {
  border-color: var(--crimson);
  background: rgba(139,0,0,0.1);
}
.location-option .loc-name {
  color: var(--gold);
  font-weight: 700;
  font-size: 1em;
}
.location-option .loc-desc {
  color: var(--text-dim);
  font-size: 0.82em;
  margin-top: 3px;
}

/* === YEAR DISPLAY === */
.year-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding: 10px 16px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(139,0,0,0.15);
  border-radius: 3px;
}
.year-text {
  font-family: 'ZCOOL XiaoWei', serif;
  color: var(--text-dim);
  font-size: 0.95em;
  letter-spacing: 2px;
}
.year-text span { color: var(--gold); }
.runs-text { color: var(--text-dim); font-size: 0.82em; }

/* === SANITY EFFECTS === */
.insane-mild { animation: mildShake 0.5s ease-in-out; }
.insane-heavy body { filter: hue-rotate(10deg); }
@keyframes mildShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-2px); }
  75% { transform: translateX(2px); }
}
.glitch-text {
  animation: glitchText 0.3s ease-in-out;
}
@keyframes glitchText {
  0% { opacity: 1; transform: skewX(0); }
  20% { opacity: 0.8; transform: skewX(-2deg); }
  40% { opacity: 1; transform: skewX(1deg); }
  60% { opacity: 0.7; transform: skewX(-1deg); }
  80% { opacity: 1; transform: skewX(0.5deg); }
  100% { opacity: 1; transform: skewX(0); }
}

/* === HIDDEN === */
.hidden { display: none !important; }

/* === RESPONSIVE === */
@media (max-width: 600px) {
  .game-title h1 { font-size: 2.4em; letter-spacing: 6px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .talent-grid { grid-template-columns: 1fr; }
  .detail-grid { grid-template-columns: 1fr; }
  .achieve-grid { grid-template-columns: repeat(2, 1fr); }
  .container { padding: 16px 12px 40px; }
  .panel { padding: 18px; }
}

/* === SEAL STAMP DECORATION === */
.seal {
  display: inline-block;
  border: 2px solid var(--crimson);
  color: var(--crimson);

// === FLOATING TALISMAN PARTICLES ===
(function() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  const particles = [];
  const CHARS = '道鬼仙魔命劫缘煞符箓咒印阵法术灵魂魄';
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();
  for (let i = 0; i < 25; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -0.2 - Math.random() * 0.4,
      char: CHARS[Math.floor(Math.random() * CHARS.length)],
      size: 10 + Math.random() * 14,
      opacity: 0.04 + Math.random() * 0.08,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.005
    });
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.rotSpeed;
      if (p.y < -30) { p.y = H + 30; p.x = Math.random() * W; }
      if (p.x < -30) p.x = W + 30;
      if (p.x > W + 30) p.x = -30;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.font = p.size + 'px "Ma Shan Zheng", serif';
      ctx.fillStyle = 'rgba(139,0,0,' + p.opacity + ')';
      ctx.textAlign = 'center';
      ctx.fillText(p.char, 0, 0);
      ctx.restore();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

let gameState = {
  talents:[], location:null, age:0, year:0,
  sanity:100, baseSanity:100, cultivation:0,
  wealth:10, connections:0, faction:'none',
  alive:true, totalRuns:parseInt(localStorage.getItem('dg_runs')||'0'),
  items:[], visitedLocations:[], factionHistory:[],
  eventHistory: new Set()
};

// === TALENT DRAW ===
function drawTalents() {
  const pool = [];
  const sp = [...TALENTS.special].sort(()=>Math.random()-0.5);
  // 15% chance per slot for special (up to 2)
  for (let i=0;i<2;i++) if (Math.random()<0.15 && sp.length) pool.push(sp.pop());
  const good = [...TALENTS.good].sort(()=>Math.random()-0.5);
  pool.push(...good.slice(0, Math.max(0, 5-pool.length)));
  const bad = [...TALENTS.bad].sort(()=>Math.random()-0.5);
  pool.push(...bad.slice(0, Math.max(0, 10-pool.length)));
  return pool.slice(0,10).sort(()=>Math.random()-0.5);
}

const RARITY_NAMES = {
  common: '凡品', uncommon: '良品', rare: '珍品', epic: '仙品', legendary: '天命', cursed: '厄运'
};

function initTalents() {
  availableTalents = drawTalents();
  gameState.talents = [];
  const grid = document.getElementById('talent-options');
  grid.innerHTML = availableTalents.map((t,i)=>`
    <div class="talent-card rarity-${t.rarity}" onclick="selectTalent(${i})" id="talent-${i}">
      <div class="talent-name">${t.name}</div>
      <div class="talent-desc">${t.desc}</div>
      <div class="talent-hint">${t.hint||''}</div>
      <span class="talent-tag">${RARITY_NAMES[t.rarity]||'凡品'}</span>
    </div>`).join('');
  updateSelectCount();
}

function refreshTalents() {
  gameState.talents = [];
  initTalents();
}

function selectTalent(i) {
  const t = availableTalents[i], card = document.getElementById('talent-'+i);
  if (card.classList.contains('disabled')) return;
  if (card.classList.contains('selected')) {
    card.classList.remove('selected');
    gameState.talents = gameState.talents.filter(x=>x.id!==t.id);
  } else if (gameState.talents.length<3) {
    card.classList.add('selected');
    gameState.talents.push(t);
  }
  document.querySelectorAll('.talent-card').forEach((c,j)=>{
    if (!c.classList.contains('selected') && gameState.talents.length>=3) c.classList.add('disabled');
    else if (!c.classList.contains('selected')) c.classList.remove('disabled');
  });
  updateSelectCount();
}

function updateSelectCount() {
  document.getElementById('selected-count').textContent = gameState.talents.length;
  document.getElementById('btn-start').disabled = gameState.talents.length!==3;
}

// === GAME START ===
function startGame() {
  gameState.baseSanity = 100; gameState.wealth = 10; gameState.connections = 0;
  gameState.cultivation = 0; gameState.age = 0; gameState.alive = true;
  gameState.items = []; gameState.faction = 'none';
  gameState.visitedLocations = []; gameState.factionHistory = [];
  gameState.eventHistory = new Set();

  gameState.talents.forEach(t=>{
    if(t.effect.sanity) gameState.baseSanity += t.effect.sanity;
    if(t.effect.wealth) gameState.wealth += t.effect.wealth;
    if(t.effect.connections) gameState.connections += t.effect.connections;
    if(t.effect.cultivation) gameState.cultivation += t.effect.cultivation;
  });
  gameState.sanity = gameState.baseSanity;
  gameState.location = LOCATIONS[Math.floor(Math.random()*LOCATIONS.length)];
  gameState.wealth += Math.floor(gameState.location.wealth/2);
  gameState.year = Math.floor(Math.random()*30)-15;
  gameState.visitedLocations.push(gameState.location.id);

  showPanel('born');
  document.getElementById('born-location').textContent = gameState.location.name;
  document.getElementById('born-desc').textContent = gameState.location.desc;
}

function confirmBorn() {
  showPanel('game');
  document.getElementById('log').innerHTML = '';
  const names = gameState.talents.map(t=>`<span class="itm">${t.name}</span>`).join('、');
  addLog(`出生于<span class="loc">${gameState.location.name}</span>`);
  addLog(`天赋: ${names}`);
  addLog(`大梁${gameState.year<0?'前'+Math.abs(gameState.year):gameState.year}年`);
  updateDisplay();
}

// === REALM & ERA ===
function getRealmName(c) {
  if(c>=400) return '造化';
  if(c>=300) return '大傩';
  if(c>=200) return '大乘';
  if(c>=150) return '化神';
  if(c>=100) return '元婴';
  if(c>=60) return '金丹';
  if(c>=30) return '筑基';
  if(c>=10) return '练气';
  if(c>=3) return '锻体';
  return '凡人';
}

function getEraName() {
  const y = gameState.year;
  if(y<-10) return '丹阳子时期';
  if(y<0) return '清风观覆灭后';
  if(y<5) return '李火旺成长期';
  if(y<15) return '坐忘道动乱';
  if(y<25) return '法教入侵';
  if(y<35) return '白玉京之战';
  return '末法时代';
}

// === NEXT YEAR ===
function nextYear() {
  if(!gameState.alive) return;
  if(waitingForChoice) return;
  gameState.age++; gameState.year++;

  // Cultivation gain
  let cultGain = 1 + Math.floor(Math.random()*2);
  if(gameState.talents.find(t=>t.id==='dao_xian')) cultGain += 3;
  if(gameState.talents.find(t=>t.id==='jie_dan') && gameState.cultivation<60) cultGain += 2;
  if(gameState.faction!=='none' && FACTIONS[gameState.faction]) {
    const fb = FACTIONS[gameState.faction].bonus;
    if(fb.cultivation) cultGain += Math.floor(fb.cultivation/3);
    if(fb.wealth) gameState.wealth += Math.floor(fb.wealth/4);
    if(fb.connections) gameState.connections += Math.floor(fb.connections/4);
    if(fb.sanity && gameState.talents.find(t=>t.id==='xinsu')) gameState.sanity += fb.sanity;
  }
  gameState.cultivation += cultGain;

  // Bad talent hidden positive effects (small yearly bonuses)
  if(gameState.talents.find(t=>t.id==='ji_bing') && Math.random()<0.12) { gameState.cultivation += 2; } // 久病成医，偶尔顿悟
  if(gameState.talents.find(t=>t.id==='pin_kun') && Math.random()<0.1) { gameState.wealth += 5; } // 穷则思变
  if(gameState.talents.find(t=>t.id==='wu_qin') && gameState.age>=12) { gameState.cultivation += 1; } // 无牵无挂，修道少阻
  if(gameState.talents.find(t=>t.id==='yu_ben') && Math.random()<0.15) { gameState.connections += 2; } // 大智若愚，人缘反好
  if(gameState.talents.find(t=>t.id==='e_meng') && Math.random()<0.08) { gameState.cultivation += 5; } // 梦中偶见天机
  if(gameState.talents.find(t=>t.id==='du_zhai') && Math.random()<0.1) { gameState.connections += 3; } // 三教九流都认识
  if(gameState.talents.find(t=>t.id==='chou_lou') && Math.random()<0.1) { gameState.cultivation += 2; } // 不为色所困，心性坚定
  if(gameState.talents.find(t=>t.id==='sha_qi') && Math.random()<0.1) { gameState.cultivation += 3; } // 邪祟不近身
  if(gameState.talents.find(t=>t.id==='mo_ying') && Math.random()<0.08) { gameState.cultivation += 4; } // 灵觉敏锐
  if(gameState.talents.find(t=>t.id==='can_ji') && Math.random()<0.1) { gameState.cultivation += 3; } // 身残志坚
  if(gameState.talents.find(t=>t.id==='zai_min') && Math.random()<0.1) { gameState.cultivation += 2; gameState.connections += 1; } // 见惯生死
  if(gameState.talents.find(t=>t.id==='bai_bing') && Math.random()<0.08) { gameState.cultivation += 3; } // 对药理敏感

  // Sanity drift - ONLY for xinsu talent holders
  const isXinsu = gameState.talents.find(t=>t.id==='xinsu');
  if(isXinsu) {
    let sanityDrift = Math.floor(Math.random()*6) - 3;
    if(gameState.talents.find(t=>t.id==='e_meng')) sanityDrift -= 2;
    if(gameState.talents.find(t=>t.id==='mo_ying')) sanityDrift -= 1;
    gameState.sanity = Math.max(0, Math.min(120, gameState.sanity + sanityDrift));
  }

  // Pick event
  let eventPool;
  if(gameState.age < 10) eventPool = [...CHILDHOOD_EVENTS];
  else if(gameState.age < 18) eventPool = [...CHILDHOOD_EVENTS.slice(-4), ...TEENAGE_EVENTS];
  else eventPool = [...ADULT_EVENTS];

  // Add special events
  SPECIAL_EVENTS.forEach(se=>{
    if(!se.trigger) return;
    if(gameState.age >= se.trigger.minAge && gameState.age <= (se.trigger.maxAge||999)) {
      if(!se.trigger.cultivation || gameState.cultivation >= se.trigger.cultivation) {
        if(!se.check || gameState.talents.find(t=>t.id===se.check)) {
          eventPool.push(se);
        }
      }
    }
  });

  // Add faction events
  if(gameState.faction!=='none' && FACTION_EVENTS[gameState.faction]) {
    eventPool.push(...FACTION_EVENTS[gameState.faction]);
  }

  // Trigger event or quiet year
  if(Math.random() < 0.72) {
    const ev = eventPool[Math.floor(Math.random()*eventPool.length)];
    showEvent(ev);
  } else {
    quietYear();
  }

  // Death checks
  if(isXinsu && gameState.sanity <= 0) { unlockAchieve('mad'); gameOver('你彻底分不清<span class="mys">现实与幻觉</span>，在无尽的噩梦中彻底迷失了。'); return; }
  const maxAge = gameState.talents.find(t=>t.id==='shou_xing') ? 95 : 82;
  if(gameState.age >= maxAge) {
    if(gameState.age>=80) unlockAchieve('old');
    if(gameState.cultivation<10) unlockAchieve('peaceful');
    gameOver('你安详地合上了双眼，走完了这一世。'); return;
  }
  if(gameState.wealth <= -80) { gameOver('你因<span class="danger-text">饥寒交迫</span>，倒毙在冰冷的街头。'); return; }
  if(gameState.age<=10 && !gameState.alive) unlockAchieve('early_death');

  // Sanity visual effects
  applySanityEffects();
  updateDisplay();
  if(autoMode && gameState.alive) autoTimer = setTimeout(nextYear, 1000/speed);
}

function quietYear() {
  const a = gameState.age;
  const isXinsu = gameState.talents.find(t=>t.id==='xinsu');
  if(isXinsu && gameState.sanity < 30 && a >= 10) {
    addLog(`第${a}年：你看到了<span class="mys">两个世界的裂缝</span>...那些不存在的东西越来越真实。`);
    gameState.cultivation += 3;
  } else if(gameState.location.danger > 50 && Math.random() < 0.25 && a >= 8) {
    addLog(`第${a}年：在<span class="loc">${gameState.location.name}</span>遭遇危险，险些丧命。`);
    if(isXinsu) gameState.sanity -= 12;
  } else if(a <= 1) {
    const msgs = ['呱呱坠地，哭声响亮','在襁褓中安睡，偶尔睁开眼看看这个世界'];
    addLog(`第${a}年：${msgs[Math.floor(Math.random()*msgs.length)]}`);
  } else if(a <= 3) {
    const msgs = ['学会了走路，摇摇晃晃像只小鸭子','开始牙牙学语，叫出了第一声"娘"','在院子里爬来爬去，对什么都好奇'];
    addLog(`第${a}年：${msgs[Math.floor(Math.random()*msgs.length)]}`);
  } else if(a <= 5) {
    const msgs = ['跟着邻家小孩在泥地里打滚','蹲在门口看蚂蚁搬家，一看就是半天','缠着大人讲故事，听到鬼怪的部分既害怕又着迷','学会了数数，能从一数到一百了'];
    addLog(`第${a}年：${msgs[Math.floor(Math.random()*msgs.length)]}`);
  } else if(a <= 9) {
    const msgs = ['和小伙伴捉迷藏，躲在草垛里睡着了','帮家里喂鸡，被大公鸡追得满院子跑','偷偷跑去河边摸鱼，被母亲揪着耳朵拎回来','开始在私塾念书，先生夸你记性好','跟着父亲去田里，学会了简单的农活'];
    addLog(`第${a}年：${msgs[Math.floor(Math.random()*msgs.length)]}`);
  } else if(a <= 14) {
    const msgs = ['帮家里放牛，在山坡上看云','去镇上跑腿买东西，对集市上的杂耍看得入迷','和同龄人比赛爬树，你总是最快的','开始懂事了，知道帮父母分担家务','在私塾里和同窗争论，先生罚你们抄书'];
    addLog(`第${a}年：${msgs[Math.floor(Math.random()*msgs.length)]}`);
  } else if(a <= 19) {
    const msgs = ['开始思考人生的方向','对远方的世界充满了好奇','在田间劳作，感到一丝对未来的迷茫','听老人们讲起修仙的传说，心中若有所动','有时候会独自坐在山头，看日落很久'];
    addLog(`第${a}年：${msgs[Math.floor(Math.random()*msgs.length)]}`);
  } else {
    const msgs = ['平淡的一年','日子不好不坏','又一年过去了','波澜不惊','日复一日'];
    addLog(`第${a}年：${msgs[Math.floor(Math.random()*msgs.length)]}`);
  }
}

// === SHOW EVENT ===
function showEvent(event) {
  const validChoices = event.choices.filter(c=>!c.check || gameState.talents.find(t=>t.id===c.check));
  if(!validChoices.length) { quietYear(); return; }
  if(autoMode) {
    // Auto mode: pick random choice
    const c = validChoices[Math.floor(Math.random()*validChoices.length)];
    applyChoice(c);
    return;
  }
  document.getElementById('event-text').innerHTML = `<strong>【第${gameState.age}年】</strong> ${event.text}`;
  document.getElementById('choices').innerHTML = validChoices.map((c,i)=>
    `<button class="choice-btn" onclick="handleChoice(${i})" data-idx="${i}">${c.text}</button>`
  ).join('');
  // Store choices for handler
  window._currentChoices = validChoices;
  waitingForChoice = true;
  document.getElementById('btn-next').disabled = true;
}

function handleChoice(idx) {
  const c = window._currentChoices[idx];
  applyChoice(c);
}

function applyChoice(c) {
  const isXinsu = gameState.talents.find(t=>t.id==='xinsu');
  if(c.effect.sanity && isXinsu) gameState.sanity = Math.max(0,Math.min(120,gameState.sanity+c.effect.sanity));
  if(c.effect.cultivation) gameState.cultivation += c.effect.cultivation;
  if(c.effect.wealth) gameState.wealth += c.effect.wealth;
  if(c.effect.connections) gameState.connections += c.effect.connections;
  if(c.effect.faction) {
    gameState.faction = c.effect.faction;
    if(!gameState.factionHistory.includes(c.effect.faction)) gameState.factionHistory.push(c.effect.faction);
    if(gameState.factionHistory.length>=3) unlockAchieve('faction_all');
  }
  if(c.item) {
    const itemData = ITEMS.find(it=>it.id===c.item);
    if(itemData && !gameState.items.find(it=>it.id===c.item)) {
      gameState.items.push({...itemData});
      if(gameState.items.length>=5) unlockAchieve('collector');
    }
  }
  if(c.achieve) unlockAchieve(c.achieve);
  addLog(c.log);
  document.getElementById('choices').innerHTML = '';
  document.getElementById('event-text').innerHTML = '命运的齿轮继续转动...';
  waitingForChoice = false;
  document.getElementById('btn-next').disabled = false;

  // Check stat-based achievements
  if(gameState.cultivation>=60) unlockAchieve('reach_jindan');
  if(gameState.cultivation>=300) unlockAchieve('reach_danuo');
  if(gameState.wealth>=200) unlockAchieve('rich');

  updateDisplay();
  if(autoMode && gameState.alive) autoTimer = setTimeout(nextYear, 1000/speed);
}

// === DISPLAY ===
function updateDisplay() {
  const isXinsu = gameState.talents.find(t=>t.id==='xinsu');
  document.getElementById('age').textContent = gameState.age;
  const sv = document.getElementById('sanity');
  if(isXinsu) {
    sv.textContent = gameState.sanity;
    sv.className = 'stat-value' + (gameState.sanity<30?' danger':gameState.sanity<60?' low':'');
    document.getElementById('sanity-section').classList.remove('sanity-hidden');
  } else {
    sv.textContent = '稳固';
    sv.className = 'stat-value';
    document.getElementById('sanity-section').classList.add('sanity-hidden');
  }
  document.getElementById('cultivation').textContent = getRealmName(gameState.cultivation);
  document.getElementById('wealth').textContent = gameState.wealth;
  document.getElementById('faction').textContent = FACTIONS[gameState.faction]?.name || '无';
  document.getElementById('connections').textContent = gameState.connections;
  document.getElementById('realm').textContent = getRealmName(gameState.cultivation);
  document.getElementById('current-location').textContent = gameState.location.name;
  document.getElementById('era-name').textContent = getEraName();
  document.getElementById('total-runs').textContent = gameState.totalRuns;
  document.getElementById('year-display').textContent =
    '大梁'+(gameState.year<0?'前'+Math.abs(gameState.year):gameState.year)+'年';

  // Sanity bar
  const pct = Math.max(0,Math.min(100,Math.round(gameState.sanity/1.2*100)/100));
  document.getElementById('sanity-bar').style.width = pct+'%';
  document.getElementById('sanity-pct').textContent = Math.round(pct)+'%';

  // Items
  const itemsEl = document.getElementById('items-display');
  if(gameState.items.length) {
    itemsEl.innerHTML = gameState.items.map(it=>`<span class="item-badge" title="${it.desc}">${it.name}</span>`).join('');
  } else {
    itemsEl.innerHTML = '';
  }
}

function addLog(text, type) {
  const log = document.getElementById('log');
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<span class="log-year">年岁: ${gameState.age}</span><span class="log-content">${text}</span>`;
  log.insertBefore(entry, log.firstChild);
}

// === SANITY EFFECTS ===
function applySanityEffects() {
  const isXinsu = gameState.talents.find(t=>t.id==='xinsu');
  if(!isXinsu) { document.body.style.filter = ''; return; }
  const container = document.querySelector('.container');
  if(gameState.sanity < 20) {
    container.classList.add('glitch-text');
    setTimeout(()=>container.classList.remove('glitch-text'), 300);
    document.body.style.filter = `hue-rotate(${Math.random()*10-5}deg) saturate(${1.1+Math.random()*0.3})`;
  } else if(gameState.sanity < 40) {
    if(Math.random()<0.3) {
      container.classList.add('insane-mild');
      setTimeout(()=>container.classList.remove('insane-mild'), 500);
    }
    document.body.style.filter = '';
  } else {
    document.body.style.filter = '';
  }
}

// === TRAVEL ===
function openTravel() {
  if(gameState.age < 12) { addLog('你还太小，不能独自远行。'); return; }
  const modal = document.getElementById('travel-modal');
  const opts = document.getElementById('travel-options');
  const cost = 10 + Math.floor(gameState.age/10)*5;
  opts.innerHTML = LOCATIONS.filter(l=>l.id!==gameState.location.id).map(l=>
    `<div class="location-option" onclick="travelTo('${l.id}',${cost})">
      <div class="loc-name">${l.name} <span style="color:var(--text-dim);font-size:0.8em;">（花费${cost}金银）</span></div>
      <div class="loc-desc">${l.desc} · 危险度: ${l.danger}</div>
    </div>`
  ).join('');
  modal.classList.add('active');
}

function travelTo(locId, cost) {
  if(gameState.wealth < cost) { addLog('金银不足，无法远行。'); closeTravel(); return; }
  gameState.wealth -= cost;
  gameState.location = LOCATIONS.find(l=>l.id===locId);
  if(!gameState.visitedLocations.includes(locId)) gameState.visitedLocations.push(locId);
  if(gameState.visitedLocations.length>=5) unlockAchieve('traveler');
  addLog(`你启程前往<span class="loc">${gameState.location.name}</span>。`);
  updateDisplay();
  closeTravel();
}

function closeTravel() {
  document.getElementById('travel-modal').classList.remove('active');
}

// === AUTO & SPEED ===
function toggleAuto() {
  autoMode = !autoMode;
  const btn = document.getElementById('btn-auto');
  btn.classList.toggle('active', autoMode);
  btn.textContent = autoMode ? '停止自动' : '自动轮回';
  if(autoMode && gameState.alive) nextYear();
  else clearTimeout(autoTimer);
}

function setSpeed(s) {
  speed = s;
  document.querySelectorAll('.btn-speed').forEach(b=>b.classList.remove('active'));
  document.getElementById('speed-'+s).classList.add('active');
}

// === GAME OVER ===
function gameOver(reason) {
  gameState.alive = false;
  autoMode = false;
  waitingForChoice = false;
  clearTimeout(autoTimer);
  document.body.style.filter = '';

  unlockAchieve('first_death');
  if(gameState.age<=10) unlockAchieve('early_death');
  if(gameState.age>=80) unlockAchieve('old');
  if(gameState.cultivation>=60) unlockAchieve('reach_jindan');
  if(gameState.cultivation>=300) unlockAchieve('reach_danuo');
  if(gameState.wealth>=200) unlockAchieve('rich');
  if(gameState.cultivation<10 && gameState.age>=70) unlockAchieve('peaceful');

  // Bad talent achievements
  if(gameState.talents.find(t=>t.id==='wu_qin') && gameState.connections>=50) unlockAchieve('orphan_rise');
  if(gameState.talents.find(t=>t.id==='pin_kun') && gameState.wealth>=150) unlockAchieve('poor_rich');
  if(gameState.talents.find(t=>t.id==='ji_bing') && gameState.age>=60) unlockAchieve('sick_healer');
  if(gameState.talents.find(t=>t.id==='chou_lou') && gameState.connections>=40) unlockAchieve('ugly_charm');
  if(gameState.talents.find(t=>t.id==='e_meng') && gameState.cultivation>=30) unlockAchieve('nightmare_seer');
  if(gameState.talents.find(t=>t.id==='can_ji') && gameState.cultivation>=60) unlockAchieve('disabled_warrior');
  if(gameState.talents.find(t=>t.id==='du_zhai') && gameState.wealth>=100) unlockAchieve('debt_free');
  if(gameState.talents.find(t=>t.id==='mo_ying') && gameState.age>=50) unlockAchieve('shadow_friend');

  gameState.totalRuns++;
  localStorage.setItem('dg_runs', gameState.totalRuns);
  localStorage.setItem('dg_achievements', JSON.stringify(achievements));

  const realm = getRealmName(gameState.cultivation);
  let ending = reason;
  if(gameState.cultivation>=400) ending = '你超脱了一切，达到了<span class="itm">造化</span>之境，与天地同寿！';
  else if(gameState.cultivation>=300) ending = '你成为了<span class="itm">大傩</span>，俯瞰芸芸众生！';
  else if(gameState.sanity<=0 && gameState.cultivation>=100 && gameState.talents.find(t=>t.id==='xinsu')) ending = '你看到了太多真相，在疯狂中窥见了大道的本质。';

  showPanel('ending');
  document.getElementById('ending-text').innerHTML = `
    <p>享年: <span style="color:var(--gold)">${gameState.age}</span> 岁</p>
    <p>境界: <span style="color:var(--gold)">${realm}</span></p>
    <p>金银: <span style="color:var(--gold)">${gameState.wealth}</span></p>
    <p>势力: <span style="color:var(--gold)">${FACTIONS[gameState.faction]?.name||'无'}</span></p>
    <p>物品: <span style="color:var(--gold)">${gameState.items.length?gameState.items.map(i=>i.name).join('、'):'无'}</span></p>
    <div class="ending-reason">${ending}</div>`;
  renderAchievements();
}

// === ACHIEVEMENTS ===
function unlockAchieve(id) {
  if(!achievements[id]) {
    achievements[id] = true;
    localStorage.setItem('dg_achievements', JSON.stringify(achievements));
  }
}

function renderAchievements() {
  const el = document.getElementById('achieve-display');
  el.innerHTML = ACHIEVEMENTS.map(a=>
    `<div class="achieve-badge ${achievements[a.id]?'unlocked':''}">
      <div class="achieve-icon">${a.icon}</div>
      <div>${achievements[a.id]?a.name:'???'}</div>
    </div>`
  ).join('');
}

// === RESTART ===
function restart() {
  autoMode = false;
  waitingForChoice = false;
  clearTimeout(autoTimer);
  document.body.style.filter = '';
  document.getElementById('btn-auto').classList.remove('active');
  document.getElementById('btn-auto').textContent = '自动轮回';
  showPanel('setup');
  initTalents();
}

function restartAuto() {
  gameState.totalRuns++;
  autoMode = true;
  document.getElementById('btn-auto').classList.add('active');
  document.getElementById('btn-auto').textContent = '停止自动';
  showPanel('setup');
  initTalents();
  // Auto-select 3 random talents and start
  setTimeout(()=>{
    while(gameState.talents.length<3) {
      const remaining = availableTalents.filter(t=>!gameState.talents.find(x=>x.id===t.id));
      if(!remaining.length) break;
      const pick = remaining[Math.floor(Math.random()*remaining.length)];
      const idx = availableTalents.indexOf(pick);
      selectTalent(idx);
    }
    startGame();
    confirmBorn();
    if(autoMode) nextYear();
  }, 100);
}

// === PANEL SHOW/HIDE ===
function showPanel(id) {
  ['setup','born','game','ending'].forEach(p=>document.getElementById(p).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// === INIT ===
document.addEventListener('DOMContentLoaded', ()=>{
  initTalents();
  // Close travel modal on backdrop click
  document.getElementById('travel-modal').addEventListener('click', (e)=>{
    if(e.target === e.currentTarget) closeTravel();
  });
});
</script>
